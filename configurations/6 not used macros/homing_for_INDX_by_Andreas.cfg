# Description: X/Y cooridnates and Endsops
################################################################################################
#
#       [Back / Y-Max: 500]
#       +---------------------+ [Y-Endstop]
#       |   ---------------   |
#       |   |             |   |
# Left  |   | Build Plate |   | Right / X-Max
# (X:0) |   |  (400x400)  |   | (X:500)
#       |   |             |   |
#       |   ---------------   |
#       |                     |
#       +---------------------+ [X-Endstop]
#    (0,0)   [Front / Y-Min: 0]
#
# 00 is only a placeholder. Will be more on the printer.
# [X-Endstop] is on tolhead Moint (x-carriage).
