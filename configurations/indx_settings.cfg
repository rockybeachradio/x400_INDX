################################################################################################

################################################################################################
Bondtech INDX Code
source: https://github.com/BondtechAB/INDX#firmware-configuration
################################################################################################

[mcu indxmcu]
# Replace the serial path below with the one from your board. Terminal command to shwo serial: $ ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Bondtech_INDX_<YOUR-SERIAL-HERE>


[indx]
mcu: indxmcu

# These are control parameters for the induction heater — leave them at these values
pid_kp: 1.0
pid_ti: 0.0
pid_td: 0.0
pid_b: 1.0


[extruder]
# Extruder represents the Smart Head's single DX extruder. INDX passive tools are not separate Klipper extruders.
# Additional tools (T1, T2, …) are defined in /indx_macros/indx.cfg

sensor_type: indx  # Custom sensor type provided by the INDX plugin — reads temperature via the IR sensor on the induction board
min_temp: 0
max_temp: 350

heater_pin: indx:heater
# Induction heating uses watermark (on/off bang-bang) control, not PID.
# This works well for induction because of its very fast response time. Do not change to pid.
control: watermark
nozzle_diameter: 0.4     # Change to match your passive tool nozzle size (0.4 / 0.6 / 0.8 / 1.0)
    # Bondtech: Düsengröße und Temperatur pro Tool kommen aus dem Slicer (T0, T1, …).
filament_diameter: 1.75

step_pin: indxmcu:motor_step
dir_pin: indxmcu:motor_dir  # If filament feeds backwards, change to: !indxmcu:motor_dir
enable_pin: !indxmcu:motor_enable
microsteps: 32
rotation_distance: 5.7  # Pre-calibrated for the DX extruder — do not change


[tmc2240 extruder]
cs_pin: indxmcu:motor_cs
spi_software_sclk_pin: indxmcu:motor_sclk
spi_software_mosi_pin: indxmcu:motor_mosi
spi_software_miso_pin: indxmcu:motor_miso
rref: 24000  # Reference resistor value for the TMC2240 on the INDX PCB — do not change
run_current: 0.6


[fan]
pin: indxmcu:part_cooling
tachometer_pin: indxmcu:part_cooling_tacho


[neopixel indx]
pin: indxmcu:led
chain_count: 16  # Fixed for the Smart Head LED array — do not change


[gcode_button endstop]
pin: ^indxmcu:endstop
press_gcode: {action_respond_info("press")}
release_gcode: {action_respond_info("release")}


[lis2dw]
# Built-in accelerometer on the INDX PCB — used for input shaper calibration
i2c_mcu: indxmcu
i2c_bus: sercom3


[angle indx]
# Magnetic encoder that reads extruder rotation — used for precise extrusion monitoring
sensor_type: as5047d
stepper: extruder
cs_pin: indxmcu:encoder_cs
spi_bus: sercom1



#####################################################################
# Load cell probe
# source: https://github.com/BondtechAB/INDX/tree/main#load-cell-probe
# The Smart Head's load cell is the printer's Z probe, so a [load_cell_probe] section is required too.
# The ADS131M02 that reads the load cell sits on the INDX toolboard, so its pins are addressed through the indxmcu MCU.
#
# Eryone used [probe]
#####################################################################

[load_cell_probe]
sensor_type: ads131m02
cs_pin: indxmcu:loadcell_cs
spi_bus: sercom1
data_ready_pin: indxmcu:loadcell_drdy
channels: 0
sample_rate: 500
z_offset: -0.15
force_safety_limit: 3200    # In mainline Klipper minimum of 100. In Kalico also lower values are allowed.
trigger_force: 150
#     trigger_force is the contact force in grams that counts as a touch.

speed: 2
retry_speed: 1.0
lift_speed: 15

# The following parameters are only known by Kalico. In mainline Klipper they do not exist:
#   pullback_distance: 0.35     # Only known by Kalico. Unknown by mainline Klipper
#   pullback_speed: 0.3         # Only known by Kalico. Unknown by mainline Klipper
#   disable_pullback_move       # Only known by Kalico. Unknown by mainline Klipper
#   drift_safety_limit          # Only known by Kalico. Unknown by mainline Klipper

samples: 3
samples_result: median
sample_retract_dist: 0.35
samples_tolerance: 0.05
samples_tolerance_retries: 3

# The following parameters are calibrated in "load cell calibration" and are written to the SAVE_CONFIG block at the bottom of the printer.cfg.
#   counts_per_gram             # Defined in SAVE_CONFIG block of printer.cfg. Generated by "load cell calibration"
#   reference_tare_counts       # Defined in SAVE_CONFIG block of printer.cfg. Generated by "load cell calibration"


#####################################################################
# Bondtech INDX Eddy / SZP coil
# Coil plugs into the toolhead SZP port.
# LDC chip is on the INDX board: ldc_int PB10, ldc_clk PB11, temp_ldc PB9
#####################################################################
[probe_eddy_current indx_eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: indxmcu
# Prefer firmware aliases if your flashed INDX firmware exports them:
#   intb_pin: indxmcu:ldc_int
#   i2c_software_scl_pin: indxmcu:ldc_clk
# Fallback to raw SAME51 pins from Bondtech's pin map:
intb_pin: indxmcu:PB10
i2c_software_scl_pin: indxmcu:PB11
i2c_software_sda_pin: indxmcu:PB9
x_offset: 0
y_offset: 0
speed: 5
lift_speed: 15

[temperature_probe indx_eddy]
sensor_type: Generic 3950
sensor_pin: indxmcu:PB9
min_temp: 0
max_temp: 100



#[cartographer]
#register_as_probe: false       #The load cell registers itself as the printer's probe, so a scanning probe on the same machine has to be told not to.


#[beacon]
#register_as_probe: false           #The load cell registers itself as the printer's probe, so a scanning probe on the same machine has to be told not to.
#prefixed_probe_commands: true      #The load cell registers itself as the printer's probe, so a scanning probe on the same machine has to be told not to.

