################################################################################################
# Calibration at initial setup of the printer
################################################################################################
# !!! Values needs to measured !!!
#
# Example:
# [X: 0] <--- 50mm ---> [X: 50] <------- 400mm Bed -------> [X: 450] <--- 50mm ---> [X: 500] (Switch)
#  Physical Limit        Left Bed Edge                       Right Bed Edge          Physical Switch
#
# gantry_motor_driver.cfg
#   [stepper_x]
#      position_endstop: 500
#    position_max: 450
#    position_min: 50  
#   [stepper_y]
#      position_endstop: 500
#    position_max: 450
#    position_min: 50
#
# OrcaSlicer - Printer Settings
#   Bed Shape Size: 400 x 400
#   Origin of printbed (X) value: 50
#   Origin of printbed (Y) value: 50



################################################################################################
# printbed position - calibration
################################################################################################
[gcode_macro PRINTBED_POSITION_HELPER_NO]
description: Helper macro for BUCKET_CALIBRATION
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {action_respond_info("Move the nozzle to the front-left corner and call the macro again.")}


[gcode_macro PRINTBED_POSITION_SAVE_FRONT_LEFT]
description: Saves the position of the printbed front-left corner
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}

    {% if confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Begin printbed min position calibration..."
        RESPOND TYPE=command MSG="action:prompt_text Save the printbed front left corner position? (Nozzle is front-left corner of the printbed)"
        RESPOND TYPE=command MSG="action:prompt_button Yes|PRINTBED_POSITION_SAVE_FRONT_LEFT CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|PRINTBED_POSITION_HELPER_NO|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set sv = printer.save_variables.variables %}
        {% set cur = printer.gcode_move.gcode_position %}

        SAVE_VARIABLE VARIABLE=printbed_position_front_left_x VALUE={cur.x|float}
        SAVE_VARIABLE VARIABLE=printbed_position_front_left_y VALUE={cur.y|float}

        RESPOND TYPE=command MSG="action:prompt_end"

        {action_respond_info(
            "Printbed fornt-left corner: %.2f,%.2f"|format(
                cur.x, cur.y
            )
        )}
    {% endif %}


