# include in printer.cfg
################################################################################################
# --- Description: X/Y cooridnates and Endsops ---
#
#       [Back / Y-Max: 500]
#       +---------------------+ [Y-Endstop]
#       |   ---------------   |
#       |   |             |   |
# Left  |   | Build Plate |   | Right / X-Max
# (X:0) |   |  (400x400)  |   | (X:500)
#       |   |             |   |
#       |   ---------------   |
#       |                     |
#       +---------------------+ [X-Endstop]
#    (0,0)   [Front / Y-Min: 0]
#
# 00 is only a placeholder. Will be more on the printer.
# [X-Endstop] is on tolhead Moint (x-carriage).
# [Y-Endstop] is on Gantry at tthe descriped position.
#
################################################################################################



################################################################################################
# Initial Setup
################################################################################################
[gcode_macro INITIAL_SETUP]
decsription: Inistial Setup of the printer.
# Source: Bondtech INDX Readme on Wiki

gcode:
    {action_respond_info("Run the numbered steps from the comments in the console, one SAVE_CONFIG at a time.")}


    #--------------------------------------------------------------------------------
    ### Set Dimensions
    # gantry_motor_driver.cfg
    #   HowTo: Home X/Y. Then jog toolehad MANUALLY to the most front.left corner. Read values from the Display. Modify values accordingly.
    #   (Exampel Values:)
    #   [stepper_x]
    #       position_endstop: 450
    #       position_max: 450
    #       position_min: 0 
    #   [stepper_y]
    #       position_endstop: 450
    #       position_max: 450
    #       position_min: 0
    #
    # OrcaSlicer - Printer Settings (Example Values:)
    #   Bed Shape Size: 400 x 400
    #   Origin of printbed (X) value: 20
    #   Origin of printbed (Y) value: 30
    #
    #



    #--------------------------------------------------------------------------------
    ### Firmware ###
    # INDX Serial Number
    #   https://github.com/BondtechAB/INDX#firmware-configuration
    # Find the serial number via terminal command:
    #   $ ls /dev/serial/by-id/
    # Copy the path that starts with usb-Bondtech_INDX and paste it into your config.


   #--------------------------------------------------------------------------------
    ### Initial setup ###
    # https://github.com/BondtechAB/INDX#initial-startup

    # 1. Verify MCU connection
    #   https://github.com/BondtechAB/INDX#1-verify-mcu-connection
    # Check in Display that indxmcu appears as connected

    # 2. Check extruder motor direction
    #   https://github.com/BondtechAB/INDX#2-check-extruder-motor-direction
    # With no filament loaded, issue a small extrude command from the Klipper console:
    G91           ; relative mode
    G1 E10 F300   ; extrude 10mm
    G90           ; back to absolute

    # 3. Check part cooling fan
    #   https://github.com/BondtechAB/INDX#3-check-part-cooling-fan
    M106 S255   ; fan full speed
    M107        ; fan off

    # 4. Verify accelerometer
    #    https://github.com/BondtechAB/INDX#4-verify-accelerometer
    Confirm it is responding:
    ACCELEROMETER_QUERY


    #4a. Run input shaper calibration (optional but recommended)
    #    https://github.com/BondtechAB/INDX#4a-run-input-shaper-calibration-optional-but-recommended
    TEST_RESONANCES AXIS=X
    TEST_RESONANCES AXIS=Y
    SHAPER_CALIBRATE


    # 5. First heat-up & heater calibration
    #    https://github.com/BondtechAB/INDX#5-first-heat-up--heater-calibration
    # It is a one-time procedure per tool/cooling setup; the results are written to your config with SAVE_CONFIG.
    # Pick up a tool first (T0) so a nozzle is present in the coil, and keep flammable material away from the Smart Head.
    # One time per tool
        INDX_CALIBRATE          # characterise the nozzle/tool and the part cooling fan - Heats the nozzle through a controlled ramp and fits the thermal-model parameters (max_power, thermal_capacity, to_ambient_r)
        INDX_FAN_CALIBRATE      # characterise the nozzle/tool and the part cooling fan - Steps the part cooling fan through several speeds and models its cooling effect on the nozzle
    
    #set this when you load filament into a tool,
        INDX_LOAD_FILAMENT      # Loads filament, primes it while measuring its heat capacity so the model accounts for the energy the filament carries away.
                                # then (with APPLY=1) writes it to your config.
        SAVE_CONFIG             # Writes the calibrated values into your [indx] config section and restarts

        # Alternative: Set it by type
        INDX_SET_MODEL_PARAMS FILAMENT_DENSITY=… FILAMENT_HEAT_CAPACITY=…   # applies known values for a material without measuring.

        # The LOAD_FILAMENT macro wraps both of these together with tool selection — see Loading Filament into Tools.



    #--------------------------------------------------------------------------------
    ### Part 3: Configuration
    #   https://github.com/BondtechAB/INDX#configuration

    ### Prepare clibration
    {% set NOZZLE_TEMP_PROBING = (printer.save_variables.variables.andreas_nozzle_probing_temp|default(150))|int %}
    {% set PRINTBED_TEMP_PROBING = (printer.save_variables.variables.andreas_printbed_temp_probing|default(60))|int %}
    {% set printbed_position_center_x = (printer.save_variables.variables.printbed_position_center_x|default(200))|int %}
    {% set printbed_position_center_y = (printer.save_variables.variables.printbed_position_center_y|default(200))|int %}
    M190 S{PRINTBED_TEMP_PROBING}       # Set printbed temperature - and wait until reached
    #M109 S{NOZZLE_TEMP_PROBING }        # Set extruder temperature - and wait until reached
    #G1 X{printbed_position_center_x} Y{printbed_position_center_y} F6000      # Move Nozzle to printbed center


    # 2. Load cell (required before any G28 Z)
    #   https://github.com/BondtechAB/INDX#load-cell-calibration
    CALIBRATE_LOAD_CELL                     # [load_cell_probe] has no counts_per_gram until this runs. Without it, G28 Z, QGL, and CAL_Z cannot tap.
                                            # This homes X and Y, opens the latch (and records soft-state Open), and tares the empty head
    # --> Now seat a passive tool on the Smart Head by hand — the tool must be empty (no filament in the extruder gears) 
    CALIBRATE_LOAD_CELL_APPLY GRAMS=1600    # Calibrate against the known locking force (default 1600 g).
                                            # The command locks, samples, then unlocks again so you can remove the tool by hand.
    SAVE_CONFIG                             # Writes those counts into the cfg so they survive the next restart.

    # --> Restart
    G28     # Then home the printer



    # 3. Dock calibration
    #   https://github.com/BondtechAB/INDX#dock-position-calibration
    #   indx-cal.cfg
    
    # 3.1 Finding dock_y (Y: fully seated position)
    #   https://github.com/BondtechAB/INDX#finding-dock_y-y-fully-seated-position

    # ??? How do I pick up the tool ???
    MANUAL_TOOLHEAD_RESET   # Records the head as open and empty without touching the latch.
                            # Use this when the head is *already* empty and only the saved state is wrong.
                            # It changes what INDX believes, not what the hardware is doing, so running it while a tool is still locked in leaves the two further apart than before.
    T0                      # Pick a tool up normally. Alternative: CHANGE_TOOL 

    # With the Smart Head holding the tool, carefully jog in Y in small increments until the tool is fully seated in the dock. When it feels fully engaged, run:
    CAL_SET_DOCK_Y
    # --> The console will report the correct dock_y value for that tool, calculated from your current Y position and the configured trigger_offset. Paste the reported value into indx.cfg:
    # Repeat for each tool and restart Klipper to apply.


    # 3.2 Finding dock_x (X: tool centre)
    #   https://github.com/BondtechAB/INDX#finding-dock_x-x-tool-centre

    M84 (disable motors)
    # --> Manually slide the toolhead to the T0 dock
    CALIBRATE_DOCK_X TOOL=0     # macro homes Y then X and reports the measuremed position for that tool.
    # --> Past the calu einto indx.cfg
    # Repeat for eah tool
    # After all tools are recorded, RESTART
    G28 # To restore normal machine coordinates

    
    # 4. Test toolchanger
    #   https://github.com/BondtechAB/INDX#first-tool-change-test
    # ??? How do I pick up the tool ???
    G28
    PARK_TOOL

    # 5. Tool Offest Calibration
    #   https://github.com/BondtechAB/INDX#tool-offsets
    # There are three methods: Print-adjust, Nudge, Camera
    # 5.1 Camera
    #   https://github.com/BondtechAB/INDX#method-3-nozzle-camera-most-precise-xy-higher-cost
    # uilt-in camera calibration workflow (CAL_ONE → CAL_TWO → CAL_THREE) that automates the offset calculation once a camera is set up.
    T0
    # --> Jog the nozzle tip to the centre of your camera crosshair
    CAL_ONE_SET_CAMERA_REF           # This saves the current position as the reference point.

    # For each tool:
    CAL_TWO_PREP_TOOL_CAL TOOL=1     # The macro picks up the tool and moves it to the camera position.
    # --> Re-centre the nozzle in the crosshair using the jog controls
    CAL_THREE_SAVE_XY_OFFSET           # The offset is calculated and saved automatically

    # 6. Z offset calibration
    #   https://github.com/BondtechAB/INDX#z-offset-calibration
    # Prerequisites:
    #   - No filament available to the extruder gears in any tool
    # The bed heater is not controlled by `CAL_Z`
    CAL_Z       # Probes every tool with the load cell and sets all Z offsets in one automated run.  calibration is performed cold
    #Alternative:
    CAL_Z NOZZLE_TEMP=150 SOAK=10   # Each tool is heated only after pickup, held at the target for the requested soak time (optional)

 


#--------------------------------------------------------------------------------

# Load filament
#    https://github.com/BondtechAB/INDX#loading-filament-into-tools
LOAD_FILAMENT TOOL=0 TYPE=PLA
# needs a calibrated thermal model —
# Edit the filament_presets table in indx-cal.cfg to add materials or tune values


    #--------------------------------------------------------------------------------
    # ???

    ### 4. Z + QGL with T0 seated
    G28                     # Now Y→X→pick T0→tap Z can work.
    QUAD_GANTRY_LEVEL       # Four Z motors still need a tap after the new head/mass. Old Eryone QGL mesh is invalid.
    CAL_Z                   # Each passive tool has its own nozzle height vs T0.
    SAVE_CONFIG


    ### 5. Eddy
    # Move nozzle ~20 mm above bed centre
    LDC_CALIBRATE_DRIVE_CURRENT CHIP=indx_eddy      # Coil drive current is unknown until the LDC is run ~20 mm over the bed.
                                                    # see: https://www.klipper3d.org/Eddy_Probe.html
    SAVE_CONFIG

    # Perform paper test at bed centre
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=indx_eddy     # Maps frequency → Z. Needs a homed machine and a paper-test at the nozzle.
    SAVE_CONFIG

    BED_MESH_CALIBRATE METHOD=scan HORIZONTAL_MOVE_Z=2      # Uses the Eddy map. Useless before the two Eddy calibrations.
    SAVE_CONFIG

    ### 





################################################################################################
# printbed position - calibration
################################################################################################
[gcode_macro PRINTBED_POSITION_HELPER_NO]
description: Helper macro for BUCKET_CALIBRATION
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {action_respond_info("Move the nozzle to the front-left corner and call the macro again.")}


[gcode_macro PRINTBED_POSITION_SAVE_FRONT_LEFT]
description: Saves the position of the printbed front-left corner
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}

    {% if confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Begin printbed min position calibration..."
        RESPOND TYPE=command MSG="action:prompt_text Save the printbed front left corner position? (Nozzle is front-left corner of the printbed)"
        RESPOND TYPE=command MSG="action:prompt_button Yes|PRINTBED_POSITION_SAVE_FRONT_LEFT CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|PRINTBED_POSITION_HELPER_NO|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set sv = printer.save_variables.variables %}
        {% set cur = printer.gcode_move.gcode_position %}

        SAVE_VARIABLE VARIABLE=printbed_position_front_left_x VALUE={cur.x|float}
        SAVE_VARIABLE VARIABLE=printbed_position_front_left_y VALUE={cur.y|float}

        RESPOND TYPE=command MSG="action:prompt_end"

        {action_respond_info(
            "Printbed fornt-left corner: %.2f,%.2f"|format(
                cur.x, cur.y
            )
        )}
    {% endif %}


[gcode_macro PRINTBED_POSITION_SAVE_BACK_RIGHT]
description: Saves the position of the printbed back-right corner
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}

    {% if confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Begin printbed min position calibration..."
        RESPOND TYPE=command MSG="action:prompt_text Save the printbed front left corner position? (Nozzle is front-left corner of the printbed)"
        RESPOND TYPE=command MSG="action:prompt_button Yes|PRINTBED_POSITION_SAVE_BACK_RIGHT CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|PRINTBED_POSITION_HELPER_NO|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set sv = printer.save_variables.variables %}
        {% set cur = printer.gcode_move.gcode_position %}

        SAVE_VARIABLE VARIABLE=printbed_position_back_right_x VALUE={cur.x|float}
        SAVE_VARIABLE VARIABLE=printbed_position_back_right_y VALUE={cur.y|float}

        RESPOND TYPE=command MSG="action:prompt_end"

        {action_respond_info(
            "Printbed back-right corner: %.2f,%.2f"|format(
                cur.x, cur.y
            )
        )}
    {% endif %}




################################################################################################
# Calibration / Defining points P0, P1, P2, P3, P4
################################################################################################
[gcode_macro BUCKET_CALIBRATION]
description: Jog to P2, then run. Reads offsets from variables.cfg, calculates points P0, P1, P3, P4 and writes all points there.
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Bucket calibration..."
    RESPOND TYPE=command MSG="action:prompt_text Calibrate X-axis position or Y-axis position?"
    RESPOND TYPE=command MSG="action:prompt_button Y-axis|_BUCKET_CALIBRATION_SAVE_Y|primary"
    RESPOND TYPE=command MSG="action:prompt_button X-axids|_BUCKET_CALIBRATION_SAVE_X|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _BUCKET_CALIBRATION_HELPER_NO]
description: Helper macro for BUCKET_CALIBRATION
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}

    {% set sv = printer.save_variables.variables %}
    {% set feed = sv.nozzle__wipe_speed|default(3000)|float %}

    {% if confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Position Nozzle..."
        RESPOND TYPE=command MSG="action:prompt_text Move Toolehad to Bucket Entry position P0 ?"
        RESPOND TYPE=command MSG="action:prompt_button Yes|_BUCKET_CALIBRATION_HELPER_NO CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|_BUCKET_CALIBRATION_HELPER_BEYBEY|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"

        G90
        G1 X{sv.bucket_p0_x} Y{sv.bucket_p0_y} F{feed}      # Travel to Waste bucket Entry point - position P0       
    {% endif %}


[gcode_macro _BUCKET_CALIBRATION_HELPER_BEYBEY]
description: Helper macro for BUCKET_CALIBRATION
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {action_respond_info("Beybey.")}


[gcode_macro _BUCKET_CALIBRATION_SAVE_X]
description: Saves the X-axis position. To calibrate position: Jog to toolhead into the middle of V-shaped groove of the V-shaped silicon block. And make the nozzle touch both sildes of the V.
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}

    {% if confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Bucket calibration X-axis..."
        RESPOND TYPE=command MSG="action:prompt_text Save the X-axis position? (Nozzle is in the V-shaped silicon block)"
        RESPOND TYPE=command MSG="action:prompt_button Yes|_BUCKET_CALIBRATION_SAVE_X CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|_BUCKET_CALIBRATION_HELPER_NO|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set sv = printer.save_variables.variables %}
        {% set cur = printer.gcode_move.gcode_position %}

        {% set bucket_p2_y_to_p1_p0 = sv.bucket_p2_y_to_p1_p0|float %}
        {% set bucket_p2_y_to_p3_p4 = sv.bucket_p2_y_to_p3_p4|float %}
        {% set bucket_p2_x_to_p0_p4 = sv.bucket_p2_x_to_p0_p4|float %}
        {% set bucket_p2_x_to_p3 = sv.bucket_p2_x_to_p3|float %}
        {% set bucket_p2_x_to_p5 = sv.bucket_p2_x_to_p5|float %}
        {% set bucket_p2_y_to_p5 = sv.bucket_p2_y_to_p5|float %}

        {% set bucket_p2_x = cur.x|float %}
        {% set bucket_p2_y = cur.y|float %}
        {% set bucket_p1_x = bucket_p2_x %}
        {% set bucket_p1_y = bucket_p2_y + bucket_p2_y_to_p1_p0 %}
        {% set bucket_p3_x = bucket_p2_x + bucket_p2_x_to_p3 %}
        {% set bucket_p3_y = bucket_p2_y + bucket_p2_y_to_p3_p4 %}
        {% set bucket_p0_x = bucket_p2_x + bucket_p2_x_to_p0_p4 %}
        {% set bucket_p0_y = bucket_p1_y %}
        {% set bucket_p4_x = bucket_p0_x %}
        {% set bucket_p4_y = bucket_p3_y %}
        {% set bucket_p5_x = bucket_p2_x + bucket_p2_x_to_p5  %}
        {% set bucket_p5_y = bucket_p2_y + bucket_p2_y_to_p5 %}


        SAVE_VARIABLE VARIABLE=bucket_p2_x VALUE={bucket_p2_x}
        #SAVE_VARIABLE VARIABLE=bucket_p2_y VALUE={bucket_p2_y}

        SAVE_VARIABLE VARIABLE=bucket_p1_x VALUE={bucket_p1_x}
        #SAVE_VARIABLE VARIABLE=bucket_p1_y VALUE={bucket_p1_y}
        SAVE_VARIABLE VARIABLE=bucket_p3_x VALUE={bucket_p3_x}
        #SAVE_VARIABLE VARIABLE=bucket_p3_y VALUE={bucket_p3_y}

        SAVE_VARIABLE VARIABLE=bucket_p0_x VALUE={bucket_p0_x}
        #SAVE_VARIABLE VARIABLE=bucket_p0_y VALUE={bucket_p0_y}
        SAVE_VARIABLE VARIABLE=bucket_p4_x VALUE={bucket_p4_x}
        #SAVE_VARIABLE VARIABLE=bucket_p4_y VALUE={bucket_p4_y}

        SAVE_VARIABLE VARIABLE=bucket_p5_x VALUE={bucket_p5_x}
        #SAVE_VARIABLE VARIABLE=bucket_p5_y VALUE={bucket_p5_y}

        RESPOND TYPE=command MSG="action:prompt_end"

        {action_respond_info(
            "P0=%.2f  P1=%.2f  P2=%.2f  P3=%.2f  P4=%.2f P5=%.2f"|format(
                bucket_p0_x, bucket_p1_x, bucket_p2_x, bucket_p3_x, bucket_p4_x, bucket_p5_x
            )
        )}
    {% endif %}


[gcode_macro _BUCKET_CALIBRATION_SAVE_Y]
description: Saves the Y-axis position. To calibrate position: Jog to toolhead into the Prime position (Font of the V-shaped front (snail-tong)  V-shaped silicon block).
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}

    {% if confirm != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Bucket calibration Y-axis..."
        RESPOND TYPE=command MSG="action:prompt_text Save the Y-axis position? (Nozzle is in the V-shaped silicon block)"
        RESPOND TYPE=command MSG="action:prompt_button Yes|_BUCKET_CALIBRATION_SAVE_Y CONFIRM=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|_BUCKET_CALIBRATION_HELPER_NO|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set sv = printer.save_variables.variables %}
        {% set cur = printer.gcode_move.gcode_position %}

        {% set bucket_p2_y_to_p1_p0 = sv.bucket_p2_y_to_p1_p0|float %}
        {% set bucket_p2_y_to_p3_p4 = sv.bucket_p2_y_to_p3_p4|float %}
        {% set bucket_p2_x_to_p0_p4 = sv.bucket_p2_x_to_p0_p4|float %}
        {% set bucket_p2_x_to_p3 = sv.bucket_p2_x_to_p3|float %}
        {% set bucket_p2_x_to_p5 = sv.bucket_p2_x_to_p5|float %}
        {% set bucket_p2_y_to_p5 = sv.bucket_p2_y_to_p5|float %}

        {% set bucket_p2_x = cur.x|float %}
        {% set bucket_p2_y = cur.y|float %}
        {% set bucket_p1_x = bucket_p2_x %}
        {% set bucket_p1_y = bucket_p2_y + bucket_p2_y_to_p1_p0 %}
        {% set bucket_p3_x = bucket_p2_x + bucket_p2_x_to_p3 %}
        {% set bucket_p3_y = bucket_p2_y + bucket_p2_y_to_p3_p4 %}
        {% set bucket_p0_x = bucket_p2_x + bucket_p2_x_to_p0_p4 %}
        {% set bucket_p0_y = bucket_p1_y %}
        {% set bucket_p4_x = bucket_p0_x %}
        {% set bucket_p4_y = bucket_p3_y %}
        {% set bucket_p5_x = bucket_p2_x + bucket_p2_x_to_p5  %}
        {% set bucket_p5_y = bucket_p2_y + bucket_p2_y_to_p5 %}


        #SAVE_VARIABLE VARIABLE=bucket_p2_x VALUE={bucket_p2_x}
        SAVE_VARIABLE VARIABLE=bucket_p2_y VALUE={bucket_p2_y}

        #SAVE_VARIABLE VARIABLE=bucket_p1_x VALUE={bucket_p1_x}
        SAVE_VARIABLE VARIABLE=bucket_p1_y VALUE={bucket_p1_y}
        #SAVE_VARIABLE VARIABLE=bucket_p3_x VALUE={bucket_p3_x}
        SAVE_VARIABLE VARIABLE=bucket_p3_y VALUE={bucket_p3_y}

        #SAVE_VARIABLE VARIABLE=bucket_p0_x VALUE={bucket_p0_x}
        SAVE_VARIABLE VARIABLE=bucket_p0_y VALUE={bucket_p0_y}
        #SAVE_VARIABLE VARIABLE=bucket_p4_x VALUE={bucket_p4_x}
        SAVE_VARIABLE VARIABLE=bucket_p4_y VALUE={bucket_p4_y}

        #SAVE_VARIABLE VARIABLE=bucket_p5_x VALUE={bucket_p5_x}
        SAVE_VARIABLE VARIABLE=bucket_p5_y VALUE={bucket_p5_y}

        RESPOND TYPE=command MSG="action:prompt_end"

        {action_respond_info(
            "P0=%.2f,%.2f  P1=%.2f,%.2f  P2=%.2f,%.2f  P3=%.2f,%.2f  P4=%.2f,%.2f  P5=%.2f,%.2f"|format(
                bucket_p0_x, bucket_p0_y, bucket_p1_x, bucket_p1_y, bucket_p2_x, bucket_p2_y, bucket_p3_x, bucket_p3_y, bucket_p4_x, bucket_p4_y, bucket_p5_x, bucket_p5_y
            )
        )}
    {% endif %}