################################################################################################
# Further calibration tools
################################################################################################
# PROBE_ACCURACY
#       !!! Shall be done with heatbed (eg. 100°C) and hotend (eg. 240°C) at printing temperature.
#       With the bed and hotend cold, move the probe to the center of the bed and run PROBE_ACCURACY.
#       It will probe the bed 10 times in a row and output a standard deviation value at the end.
#       Make sure that the sensed distance is not trending (gradually decreasing or increasing over the 10 probes)
#       and that the standard deviation is less than 0.003mm.
#       Console Output:
#           ...
#           probe accuracy results: maximum -0.113750, minimum -0.129375, range 0.015625, average -0.117969, median -0.116094, standard deviation 0.004296

# PID_CALIBRATE HEATER=heater_bed TARGET=100
#    1) Move nozzle to the center of the bed and approximately 5-10mm above the bed surface:
#        G1 X200 Y200 Z10
#    2) Run PID Calibration for the printbed heater. Duration is aproximately 10 minutes:
#        PID_CALIBRATE HEATER=heater_bed TARGET=100
#    3) Save the value
#        SAVE_CONFIG

# PID_CALIBRATE HEATER=extruder TARGET=245
#    1) Move nozzle to the center of the bed and approximately 5-10mm above the bed surface:
#        G1 X200 Y200 Z10
#    2) Set the part cooling fans to 25%:
#        M106 S64
#    3) Run the PID calibration for the toolhead nozle heater. Duration is aproximately 5 minutes:
#        ID_CALIBRATE HEATER=extruder TARGET=245
#    4) Save the value
#        SAVE_CONFIG

#####################################
# GET_POSITION
#       Shows where Klipper thinks the toolhead is currently
#       Console Outputs:
#           ...
#           toolhead: X:-1.000000 Y:0.000000 Z:15.000000 E:0.000000
#           ...



################################################################################################
# G32
################################################################################################
[gcode_macro G32]
description: Custom gcode macro, typically in Voron printers. Used to perform a "full home" procedure. Can be uesd at PRINT_START Macro
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32            # merkt sich den aktuellen G-Code-Zustand. Ohne würde macro den drucker "schmutzig" hinterlassen.
    #BED_MESH_CLEAR                          # Delets existing bed meshes   # Why that? # commented out (by andreas)
    G90                                     # Set absolute mode

    #G28                                     # homes all axis - part of quad_gantry_level
    QUAD_GANTRY_LEVEL                       # Performing quad gantry levling
    #G28                                     # homes all axis - part of quad_gantry_level
    #PARK_TOOLHEAD                           # Parking the toolhead  - part of quad_gantry_level
    RESTORE_GCODE_STATE NAME=STATE_G32




################################################################################################
# Macro to exceture "all" the following calibrations:
################################################################################################
[gcode_macro calibration_all]
description: Calibrate the printer before use
# Written by Eryone
gcode:  
    { action_respond_info("Starting printer calibration process") }
    M117 Calibrate_all: Starting printer calibration process

    ABORT     # Aborts the calibration process, discarding the current results. This command is only available during drift calibration.
    
    SET_PIN PIN=LED VALUE=0.50                          # Turn LED to 50%
    SET_FAN_SPEED FAN=chamber_exhaust_fan SPEED=0.5     # Does not make sense because of PID calibrations
    # SET_FAN_SPEED FAN=electronics_bay_fan SPEED=1     # Controlled via: [controller_fan electronics_bay_fan]
    M106 S100           # set fan speed

    # homing
    M117 Calibrate_all: Preparing the pritner for calibration. time left: 70 minutes
    G28                 # home axis (to move toolehad)
    G1 X200 Y200 Z50    # move toolhead away from heatbed

    # extruder PID
    M117 Calibrate_all: Extruder PID_CALIBRATE in progress, time left: 65 minutes
    PID_CALIBRATE HEATER=extruder TARGET=180
    M106 S255
    M104 S0             # set extruder temp
    M140 S0

    # print bed PID
    M117 Calibrate_all: Print bed PID_CALIBRATE in progress, time left: 60 minutes
    PID_CALIBRATE HEATER=heater_bed TARGET=65

    # quad gantry leveling
    M117 Calibrate_all: QUAD_GANTRY_LEVEL in progress, time left: 50 minutes
    #G28                 # home all axis - part of quad_gantry_level
    M104 S150            # set extruder temp
    QUAD_GANTRY_LEVEL_BASE  horizontal_move_z=10 retry_tolerance=0.05 LIFT_SPEED=5      # QGL set bed temperature to 65 °C
 
    # something (by eryone)...
    #G28                 # home all axis - part of quad_gantry_level
    M119                # get endstop status
    #M106 S255           # set fan speed to 100% - Turn fan on       # deactivated (by andreas)
    # M140 S50          # set bed temp to 50°C - does not make sense
    G1 X200 Y200 Z50    # move head

    # Cooling chamber to prepare heatbed PID - called before input shaper to give chamber time to cool down. Needed for chamber PID calibration
    SET_FAN_SPEED FAN=chamber_exhaust_fan SPEED=1     # Does not make sense because of PID calibrations

    # input shaper
    M117 Calibrate_all: SHAPER CALIBRATE in progress, time left: 40 minutes 
    SHAPER_CALIBRATE

    # something (by eryone)...
    #M107                # Turn fan off    # deactivated (by andreas)

    # Chamber should be cool now
    SET_FAN_SPEED FAN=chamber_exhaust_fan SPEED=0        # Deactivate fan

    # bed mesh
    M117 Calibrate_all: BED_MESH_CALIBRATE in progress, time left: 30 minutes 
    M104 S150           # set extruder temp
    # ??? Why not setting bed temperature ??
    # G28                 # home all axis - not needed: SAVE_CONFIG restarts firmware.
    BED_MESH_CALIBRATE PROFILE='default'    # KAMP Function

    # chamber heater PID
    M117 Calibrate_all: Chamber heater PID_CALIBRATE in progress, time left: 20 minutes
    #CALIBRATE_CHAMBER_PID TARGET=50                      # call by Andreas
    PID_CALIBRATE HEATER=heater_bed TARGET=50            # PETG aprox 50°C
  
    # shut down sequence
    M117 Calibrate_all: Calibration completed. Park printer, time left: 1 minutes
    G4 P1000            # wait
    M400                # wait until all command completed / no movement
    M104 S0             # set extruder temp
    #G1 Z50             # move toolhead
    #G1 X200 Y200       # move toolehad
    PARK_TOOLHEAD       # toolehad parken
    M84                 # turn off stepper motors
    SAVE_VARIABLE VARIABLE=allcalibrate VALUE=0         # Not used anywhere (by eryone)

    # save config (by andreas)
    M400
    M117 Calibrate_all: Saving results. Printer calibration process completed.
    SAVE_CONFIG

    M117 Calibrate_all: 
    Printer calibration process completed.



################################################################################################
# Z probe reset - gcode_macros
################################################################################################
##############################################################
# Z probe is defined in EECAN.cfg

##############################################################
[gcode_macro RS_probe]
description: Re-zero the piezo baseline on the STM32G030 (PA5 falling edge) --> quick re-zero for a frew fresh samples, re-arms the trigger. --> use before any probing
    # Baseline reset (“reset_probe”) → pull PA5 (on STM32G030) LOW briefly. STM32G030 recomputes the zero baseline by averaging several CS1237 reads (with delays), then resumes detection. Use this before probing cycles. 
    # used in: calibration.cfg   &    printjob_mgmt.cfg [gcode_macro _CLEAN_N]
gcode:
    { action_respond_info("gcode_macro RS_probe: reset probe baseline") }    # Feedback Message to Mainsail console
    M400                                # Wait for all current moves to finish (flushes the planner queue)
    ;reset_probe_adc                    # Calls the macro reset_probe_adc
    ;G4 P0                              # Wait 0ms
    SET_PIN PIN=reset_probe VALUE=1     # Set the reset_prove to the logic level HIGH. Pin defined in EECAN.cfg
    G4 P100                             # Wait 100ms
    SET_PIN PIN=reset_probe VALUE=0     # Set the reset_probe to the logic level LOW (0V). Pin defined in EECAN.cfg
    G4 P200                             # Wait 200ms
    SET_PIN PIN=reset_probe VALUE=1     # Set the reset_prove to the logic level HIGH. Pin defined in EECAN.cfg
    G4 P100                             # Wait 100ms

##############################################################
[gcode_macro reset_probe_adc]
description: Re-init CS1237 + re-zero (PA6 falling edge) --> Hard reset. re-initializes the CS1237 ADC (rate/gain/reference) and then does a baseline reset. --> do once after power-up / firmware restart
    # Reset or calibrate the analog-to-digital converter (ADC) signal used by a resistive probe. eg. Z-probe
    # ADC reset (“rt_probe_adc” in spirit) → pull PA6 (on STM32G030) LOW briefly. STM32G030 re-initializes CS1237 (REF=1, 640 Hz, PGA=128, CH A) and then re-zeros. Use this if things got noisy or after power transients.
gcode:
    { action_respond_info("gcode_macro reset_probe_adc: reset probe baseline") }    # Feedback Message to Mainsail console
    SET_PIN PIN=rt_probe_adc VALUE=1       # Set the pin rt_probe_abc to HIGH (1). Pin defined in EECAN.cfg
    G4 P100                                # Waits 100ms
    SET_PIN PIN=rt_probe_adc VALUE=0       # Set the pin rt_probe_abc to LOW (0). Pin defined in EECAN.cfg
    G4 P500                                # Pause for 500ms
    SET_PIN PIN=rt_probe_adc VALUE=1       # Set the pin rt_probe_abc to HIGH (1). Pin defined in EECAN.cfg
    G4 P200                                # Pause for 200ms



############################################################################
[gcode_macro SAFE_QGL]
description: ??? Why that ?
gcode:
    {% set saved_temp = printer.extruder.target %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    M109 S150       # Set hotend temperature ands wait until reached
    
    # Temporarily "unload" to avoid E-checks (no real extrusion)
    G92 E0
    G1 E-1 F100  # Tiny relative retract (safe at low temp)
    
    QUAD_GANTRY_LEVEL  # Call Gcode_macro
    
    # Reheat
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={saved_temp}
    M109 S{saved_temp}
    
    G92 E0  # Reset E position




################################################################################################
# Homing
################################################################################################
######################################################
#[safe_z_home]
# description:
    # Z-axis limit coordinates (deactivated by Eryone)
    # Replaced by homing_override
#home_xy_position: 200,200      # Z-axis homing posiition (for Z End Stop)     # Change coordinates to the center of your print bed
#speed: 100                     # Homing pseed
#z_hop: 4                       # Lift Z-axis height before homimg (in mm) Default: 10
#z_hop_speed: 5                 # ???


######################################################
[gcode_macro homing_override]
# decsription:
    # homing_override takes over the full controll of homing. So this is needed to call teh homing routines. Here custom honing gcode_macros
    # reference: https://github.com/EricZimmerman/Voron24/blob/PreKlippain/macros/helpers/homing.cfg
    #            https://github.com/Frix-x/klippain/blob/main/macros/base/homing/homing_override.cfg
    #            https://github.com/EricZimmerman/Voron24/blob/PreKlippain/macros/helpers/homing.cfg

axes: xyz               # Defines which axes this custom homing override(s) applies to.
                        # For example, if this is set to "z" then the override script will only be run when the z axis is homed (eg, via a "G28" or "G28 Z0" command).
                        # Note, the override script should still home all axes.
                        # The default is "xyz" which causes the override script to be run in place of all G28 commands.
#set_position_z: 0      # If specified, the printer will assume the axis is at the specified position prior to running the g-code commands.
                        # Setting this disables homing checks for that axis. This may be useful if the head must move prior to invoking the normal G28 mechanism for an axis.
                        # The default is to not force a position for an axis.
                        # --> Replaced by 
gcode:
    # Define variables    
        {% set debug_mode = printer.save_variables.variables.andreas_debug_mode|default(False) %}

        {% set home_all_1 = 'x' not in params|lower and 'y' not in params|lower and 'z' not in params|lower and 'n' not in params|lower %}   # If G28 was called, without parameters, then: home_all == True
                 # {% set home_all = (params|length == 0) %}    # Not working. Because G28 always handes over params = {'G': '28'}
        {% set home_all_2 = 'x' not in printer.toolhead.homed_axes|lower or 'y' not in printer.toolhead.homed_axes|lower %}       # if x or y axis are not homed: home_all == True  -  Why? Because Z is set to homed, even if it is not homed. "set_postiion_z: 0" (by andreas)

        {% set home_all = home_all_1 or home_all_2 %}

        {% set NOZZLE_TEMP_PROBING = (printer.save_variables.variables.andreas_nozzle_probing_temp|default(150))|int %}

    {% if debug_mode %}     # Debuging: Print variables
        {% set homing_parameters = params %}

        {action_respond_info("G28 handed over params = " ~ params|string)}
        {action_respond_info("homing_parameters = %s "%homing_parameters)}
        {action_respond_info("home_all = " ~ home_all)}
        {action_respond_info("printer.toolhead.homed_axes = " ~ printer.toolhead.homed_axes)}

        {% if 'x' not in printer.toolhead.homed_axes|lower %}
            { action_respond_info("x axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("x axis is in printer.toolhead.homed_axes") }
        {% endif %}
        {% if 'y' not in printer.toolhead.homed_axes %}
            { action_respond_info("y axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("y axis is in printer.toolhead.homed_axes") }
        {% endif %}
        {% if 'z' not in printer.toolhead.homed_axes %}
            { action_respond_info("z axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("z axis is in printer.toolhead.homed_axes") }
        {% endif %}
        {% if 'e' not in printer.toolhead.homed_axes %}
            { action_respond_info("e axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("e axis is in printer.toolhead.homed_axes") }
        {% endif %}
        { action_respond_info("-") }
    {% endif %}     # debug_mode

    M400    # M400 - wait to finish all pending moves/process the buffer

    {% if ('z' not in printer.toolhead.homed_axes) %}
        # If Z axis not homed: SET_KINEMATIC and make safety Z-HOP (Z lift)
        M117 Define current position of Z axis as 0
        {% set home_all = True %}        # Set home_all to true
        
        SET_KINEMATIC_POSITION Z=0      # Define current position of Z axis as 0

        M117 Lifting Z by 3mm - for safety
        { action_respond_info("Lifting Z by 3mm") }
        M400
        G91                             # Puts printer into relative positoning mode. All movenete commands are relative to the current position. (oposite of G90)
        G1 Z3 F1000                     # Lift Z by 5mm. For saftey that it does not scratch the print bed.
        G90                             # Puts printer into absoulute positioning mode. All movements commands are from the origin. (oposite of G91)

        M400

        M117 Call: reset_probe_adc
        { action_respond_info("Call: reset_probe_adc") }
        reset_probe_adc     # Call macro to reset z-nozzle probe chip
    {% endif %} 

    {% if home_all or 'z' in params|lower %}
        # Preheating the nozzle to reduce wiaitng time between XY homing and Z homing.
        M117 Start heating nozzle to safe time beween homing XY and Z.
        { action_respond_info("Start heating nozzle to safe time beween homing XY and Z.") }
        M104 S{ NOZZLE_TEMP_PROBING }     # Set extruder temperature
    {% endif %} 

    M400

    {% if home_all or 'x' in params|lower %}      # if G28 X was called
        M117 Homing X
        { action_respond_info("Homing X") }

        # Defines the amount of current during homing
        {% set HOMING_STEPPER_XY_RUN_CURRENT = (printer.save_variables.variables.andreas_homing_stepper_xy_run_current|default(0.49))|float %}

        # Get actual current settings for stepper motors
        {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
        {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}

        # Reduce current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
    
        M400
        G28 X           # homes X - original klipper command.

        G91             # Set to relative mode
        G1 X-15 F1200   # Move toolhead away from enstop switch when finished to remove stress from the mechanic
        G90

        # Set back current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    {% endif %}
  
    M400

    {% if home_all or 'y' in params|lower %}
        M117 Homing Y
        { action_respond_info("Homing Y") }

        # Defines the amount of current during homing
        {% set HOMING_STEPPER_XY_RUN_CURRENT = (printer.save_variables.variables.andreas_homing_stepper_xy_run_current|default(0.49))|float %}

        # Get actual current settings for stepper motors
        {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
        {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}

        # Reduce current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
    
        M400
        G28 Y           # homes Y - original klipper command.

        G91             # Set to relative mode
        G1 Y-15 F1200   # Move toolhead away from enstop switch when finished to remove stress from the mechanic
        G90

        # Set back current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    {% endif %}
  
    M400

    {% if home_all or 'z' in params|lower %}
        M117 Homing Z
        { action_respond_info("Homing Z") }

        # stepper motor run_current reduction is done in [probe] section
        # Nozzle temperature is set in [probe]
        
        M400
        G90             # Set to absolute mode
        G1 X200 Y200 F6000
        
        M400
        RS_probe        # calls the macro RS_Probe

        M400
        G28 Z           # homes Z - original klipper command.  
        
        M104 S0         # Set extruder temperature

        G90             # Set to absolute mode
        G1 Z5 F1200     # Lift Toolhead to 5mm above the print bed to remove stress from zhe piezzo element
    {% endif %}

    M400
    {% if 'n' in params|lower %}
        # Command: G28 N - Homes the nozzle at its current postition (Z axis only). No movement of the toolhead to the middle of the bed.
        # "G28 N" is called in printjob_mgmt.cfg [gcode_macro _CLEAN_N]
        {% if 'xy' not in printer.toolhead.homed_axes  %}       # If not homed on X and Y
            { action_respond_info("! Homing Z at current position not possible. Home XY axis first.") }
        {% else %}
            M117 Homing Z at current position - G28 N
            { action_respond_info("Homing Z at current position - G28 N") }

            # stepper motor run_current reduction is done in [probe] section
            # Nozzle temperature is set in [probe]

            M400
            RS_probe        # calls the macro RS_Probe

            M400
            G28 Z           # homes Z - original klipper command.  
            
            M104 S0         # Set extruder temperature

            G90             # Set to absolute mode
            G1 Z5 F1200     # Lift Toolhead to 5mm above the print bed to remove stress from zhe piezzo element
        {% endif %}
    {% endif %}
